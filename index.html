<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxytips</title>
    <style>
      .post-card:hover {
        background-color: rgba(128, 128, 128, 0.027);
        cursor: pointer;
        transition: 0.5s, ease-in;

      }
      .pst-container {
        display: grid;
        grid-template-columns:600px 1fr;
        gap: 30px;
        font-family: Arial;
      }
      .pst-container p{
        max-width: 80%;
      }
      .pst-container div {
        margin-bottom: 30px;
        padding: 10px;
        align-items: center;
      }
      .pst-container img {
        object-fit: cover;
        max-width: 500px;
      }

      .post-image{
  width:100%;
  max-height:400px;
  object-fit:cover;
  background:#eee;
  object-position: top;
}

.post-content{
  padding:18px;
}

.post-category{
  display:inline-block;

  color:rgb(46, 156, 96);
  padding:6px 10px;
  border-radius:30px;
  font-size:1.2rem;
  margin-bottom:12px;
  font-weight:600;
}

.post-title{
  font-size:18px;
  margin-bottom:12px;
  color: rgb(255, 136, 0);
}

.post-text{
  color:#2c3130;
  line-height:1.6;
  margin-bottom:15px;
}

@media(max-width:700px){

  .pst-container{
    grid-template-columns:1fr;
  }
}

    </style>

</head>
<body>
  <div class="section-title">
  <h2>Published Posts</h2>
  <span id="postCount">0</span>
</div>
     <section class="card" id="posts-section">

      <div class="section-title">
        <h2>Published Posts</h2>
      </div>

      <div id="postsContainer" class="posts-grid"></div>

    </section>
<script>

let posts = JSON.parse(localStorage.getItem("oxytipsPosts")) || [];

function renderPosts(){

  const container =
    document.getElementById("postsContainer");

  const postCount =
    document.getElementById("postCount");

  container.innerHTML = "";

  postCount.textContent = posts.length;

  if(posts.length === 0){

    container.innerHTML = `
      <div class="empty">
        No posts available yet.
      </div>
    `;

    return;
  }

  posts.forEach(post => {

    const card = document.createElement("div");
    card.className = "post-card";

    card.innerHTML = `<div class="pst-container">
      ${
        post.image
        ? `<div><img src="${post.image}" class="post-image"></div>`
     
        : `<div class="post-image"></div>`
      }

      <div class="post-content">

        <span class="post-category">
          ${post.category}
        </span>

        <h3 class="post-title">
          ${post.title}
        </h3>

        <p class="post-text">
          ${post.content}
        </p>

        ${
          post.video
          ? `
            <video controls class="post-video">
              <source src="${post.video}" type="video/mp4">
            </video>
          `
          : ""
        }

        <br><br>

        <small>
        ${post.createdAt}
        </small>

        <br><br>
      </div>
      </div>
    `;

    container.appendChild(card);
  });
}

/* MEDIA LIBRARY */
function renderMedia(){

  const mediaGrid =
    document.getElementById("mediaGrid");

  const mediaCount =
    document.getElementById("mediaCount");

  mediaGrid.innerHTML = "";

  let count = 0;

  posts.forEach(post => {

    if(post.image){

      count++;

      mediaGrid.innerHTML += `
        <img src="${post.image}">
      `;
    }

    if(post.video){

      count++;

      mediaGrid.innerHTML += `
        <video controls>
          <source src="${post.video}" type="video/mp4">
        </video>
      `;
    }
  });

  mediaCount.textContent = count;

  if(count === 0){

    mediaGrid.innerHTML = `
      <div class="empty">
        No media uploaded yet.
      </div>
    `;
  }
}

/* DELETE POST */
function deletePost(id){

  if(confirm("Delete this post?")){

    posts = posts.filter(post => post.id !== id);

    localStorage.setItem(
      "oxytipsPosts",
      JSON.stringify(posts)
    );

    renderPosts();
    renderMedia();
  }
}
  renderPosts();


</script>
</body>
</html>
